# Theorem / claim registry — application-agnostic.
#
# One entry per theoretical claim (theorem/proposition/lemma/corollary/
# explicit remark) extracted from a governing theory document. This
# registry is NOT specific to `deep_dissipative_nlink`: the schema supports
# multiple `theory_source` documents and multiple `applies_to_experiments`,
# so a future `duffing_doublewell` or `nonlinearbenchmark.org`-style task
# built on the same shared `EBM_model` port-Hamiltonian architecture can
# register its own claims (or reuse these) without restructuring.
#
# Populated, for this pass, from:
#   reference_robust_extensions.tex   (theory)
#   results/deep_dissipative_nlink/copilotA1_theory_formal_verification_cross_audit.md (T1-T18)
#
# Do not paraphrase away quantifiers/strictness when editing this file.

schema_version: 1

theory_sources:
  - id: reference_robust_extensions
    path: reference_robust_extensions.tex
    role: "Level-1 authoritative theory (theorems/propositions/assumptions/domains)."

claims:
  - claim_id: T1
    label: "eq:ph_dynamics (J skew-symmetry)"
    theory_source: reference_robust_extensions
    section: "Methods / Port-Hamiltonian neural ODE"
    name: "Interconnection matrix skew-symmetry"
    claim_type: model_class_requirement
    statement: "J_{theta_J}(z) = -J_{theta_J}(z)^T for all z."
    hypotheses: []
    conclusion: "q^T J q = 0 for every real q (used in the dissipativity derivation)."
    domain: "all z in R^d"
    quantifier: "for all z"
    local_or_global: global
    strict_or_nonstrict: exact_equality
    continuous_or_discrete: continuous_time
    nominal_or_robust: nominal
    model_objects: [J, A_theta]
    directly_relevant_experiments: [deep_dissipative_nlink]
    executable_verification_meaningful: true
    cross_audit_ref: "copilotA1_theory_formal_verification_cross_audit.md row T1"
    implementation_ref: "EBM_model/EBM_param_fields.py::_assemble_A"
    stress_test_ref: "none in the legacy suite.py pipeline; new: certificates/structural_checks.py::check_skew_symmetry"

  - claim_id: T2
    label: "eq:ph_dynamics (R PSD)"
    theory_source: reference_robust_extensions
    section: "Methods / Port-Hamiltonian neural ODE"
    name: "Dissipation matrix positive semidefiniteness"
    claim_type: model_class_requirement
    statement: "0 <= R_{theta_R}(z) = R_{theta_R}(z)^T for all z."
    hypotheses: []
    conclusion: "-grad(H)^T R grad(H) <= 0 (used in the dissipativity derivation)."
    domain: "all z in R^d"
    quantifier: "for all z"
    local_or_global: global
    strict_or_nonstrict: non_strict_required_strict_implemented
    continuous_or_discrete: continuous_time
    nominal_or_robust: nominal
    model_objects: [R, M_theta]
    directly_relevant_experiments: [deep_dissipative_nlink]
    executable_verification_meaningful: true
    cross_audit_ref: "copilotA1_theory_formal_verification_cross_audit.md row T2"
    implementation_ref: "EBM_model/EBM_param_fields.py::_assemble_M, _cholesky_bounded"
    stress_test_ref: "new: certificates/structural_checks.py::check_dissipation_pd"

  - claim_id: T3
    label: "eq:energy_balance"
    theory_source: reference_robust_extensions
    section: "Methods / Port-Hamiltonian neural ODE"
    name: "Unforced dissipativity identity"
    claim_type: theorem
    statement: "dH/dt = -grad(H)^T R grad(H) + y_p^T u <= y_p^T u."
    hypotheses: ["T1", "T2", "H continuously differentiable"]
    conclusion: "Dissipativity relation with storage H and supply rate y_p^T u."
    domain: "all z in R^d, all admissible u"
    quantifier: "for all z, u; along every solution"
    local_or_global: global
    strict_or_nonstrict: non_strict
    continuous_or_discrete: continuous_time
    nominal_or_robust: nominal
    model_objects: [H_theta, R, J, y_p]
    directly_relevant_experiments: [deep_dissipative_nlink]
    executable_verification_meaningful: true
    cross_audit_ref: "copilotA1_theory_formal_verification_cross_audit.md row T3"
    implementation_ref: "EBM_model/EBM_param_fields.py::vector_field_and_output (uses CLIPPED gradient g, not exact grad(H))"
    stress_test_ref: "new: certificates/unforced_dissipativity_probe.py (SAMPLED_ONLY, finite-difference)"

  - claim_id: T4
    label: "eq:coercive_lower_bound, App. app:hybrid"
    theory_source: reference_robust_extensions
    section: "Methods / Hybrid modern Hopfield Hamiltonian"
    name: "Coercivity of the hybrid Hamiltonian"
    claim_type: proposition
    statement: "H_theta(z) >= (1/2)||z||^2 - c1||z|| - c0 for finite c0,c1 >= 0, given the first hidden activation has bounded image and bounded derivative and deeper maps are continuous."
    hypotheses: ["first hidden activation Psi_2 bounded image & bounded derivative", "deeper maps continuous"]
    conclusion: "H_theta is coercive; sublevel sets are compact whenever nonempty."
    domain: "all z in R^d"
    quantifier: "for all z"
    local_or_global: global
    strict_or_nonstrict: non_strict
    continuous_or_discrete: not_time_dependent
    nominal_or_robust: nominal
    model_objects: [H_theta]
    directly_relevant_experiments: [deep_dissipative_nlink]
    executable_verification_meaningful: false
    notes: >-
      Theory's proof is for a Hamiltonian WITHOUT the per-layer bias term
      that EBM_class.py::energy_layer_k actually includes; extension is
      plausible (see cross-audit) but not written in the .tex and not
      re-derived here as a formal proof.
    cross_audit_ref: "copilotA1_theory_formal_verification_cross_audit.md row T4"
    implementation_ref: "EBM_model/EBM_class.py::energy_EBM"
    stress_test_ref: "none (proof-extension obligation, not a numerical check)"

