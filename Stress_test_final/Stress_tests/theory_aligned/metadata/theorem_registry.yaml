    claim_type: proposition
    statement: "U_CBF(z) = {u in U : a_H(z)^T u <= d_H(z) + alpha(h_eps(z))} for every z in D."
    hypotheses: ["T1", "T2", "H is C^1 with locally Lipschitz gradient", "f_theta locally Lipschitz in z"]
