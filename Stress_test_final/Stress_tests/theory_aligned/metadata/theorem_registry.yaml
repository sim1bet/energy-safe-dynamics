    theory_source: reference_robust_extensions
    section: "Results / When is the local PL condition justified?"
    name: "Local Clarke-Hessian certificate for PL"
    claim_type: proposition
    statement: "If m_star := min_{M in Clarke-Hessian(z_star)} lambda_min(M) > 0, then for 0<mu_star<m_star there is a convex neighborhood on which (1/2)||grad H||^2 >= mu_star*(H(z)-H(z_star))."
    hypotheses: ["T5 (z_star exists, grad(H(z_star))=0)", "H is C^1 with locally Lipschitz gradient"]
    conclusion: "Local PL inequality (strong-convexity-equivalent) around z_star."
    domain: "neighborhood N_star of z_star"
    quantifier: "for all z in N_star"
    local_or_global: local
    strict_or_nonstrict: strict_positive
    continuous_or_discrete: not_time_dependent
    nominal_or_robust: nominal
    model_objects: [z_star, Clarke_Hessian, mu_star]
    directly_relevant_experiments: [deep_dissipative_nlink]
    executable_verification_meaningful: true
    notes: >-
      For copilotA1's smooth activations (tanh, polynomial_stable), the
      Clarke generalized Hessian is the ordinary Hessian (singleton set) --
      "the result reduces to the classical Hessian test" (theory's own
      remark). No nonsmooth machinery is actually required for this
      architecture.
    cross_audit_ref: "copilotA1_theory_formal_verification_cross_audit.md row T12"
    implementation_ref: "none — no Hessian/PL computation exists anywhere in Stress_tests/"
    stress_test_ref: "new: certificates/equilibrium_hessian_probe.py (finite-difference Hessian at the CURRENT non-stationary candidate only; does NOT establish T12, since T5 is unresolved)"

