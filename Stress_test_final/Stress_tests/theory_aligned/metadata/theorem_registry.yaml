    model_objects: [d_H, a_H, h_eps, alpha]
    directly_relevant_experiments: [deep_dissipative_nlink]
    executable_verification_meaningful: true
    cross_audit_ref: "copilotA1_theory_formal_verification_cross_audit.md row T6"
