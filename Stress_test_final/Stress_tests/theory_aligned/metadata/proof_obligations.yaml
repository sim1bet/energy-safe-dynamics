    quantifier: "for all z (theory); tested only at finitely many sampled z (implementation)"
    domain: "all z in R^d (theory); Gaussian-sampled states (implementation)"
    enforcement: guaranteed_by_exact_algebra
    implementation_object: "Algebraically implied by OB-T2-1 (M PSD/PD) for ANY gradient vector g, by definition of a quadratic form"
    verification_method: "Finite-difference (h=1e-4) approximate grad(H) at 8 random states, combine with checkpoint's exact M, check g^T M g >= 0."
    tolerance: "none needed (quadratic form with PD matrix is unconditionally >=0; finite-difference error only affects the reported g, not the conclusion's validity)"
    soundness_status: exact_algebraic_consequence_of_OB-T2-1_confirmed_numerically
    testability_status: executable
    current_evidence: >-
      EXECUTED for copilotA1: drift_raw_nonneg=True and drift_clipped_nonneg=True
      at all 8 sampled states (state norms 9.3-17.6). ADDITIONALLY: clip_scale_factor
      (clipped/raw gradient norm) ranged 0.54-0.98 across these samples,
      confirming GRAD_E_CLIP=200 is materially active (up to 46% shrinkage)
      even at moderate, non-extreme state norms -- not just at the well.
    status: STRUCTURAL_REGRESSION_CHECKED
    canonical_test: "Stress_tests/theory_aligned/certificates/unforced_dissipativity_probe.py"

