# Proof-obligation registry — atomic conditions decomposed from theorem_registry.yaml.
#
# Every obligation traces to exactly one parent claim_id in theorem_registry.yaml.
# `enforcement` uses the vocabulary required by the restructuring task:
#   guaranteed_by_architecture | guaranteed_by_parameterization |
#   guaranteed_by_exact_algebra | guaranteed_by_constrained_optimization |
#   encouraged_by_soft_penalty | checked_analytically |
#   checked_by_sound_numerical_method | checked_only_by_sampling |
#   not_checked | not_checkable_without_additional_machinery
#
# `status` uses the required proof-obligation vocabulary:
#   PROVED_BY_CONSTRUCTION | ANALYTICALLY_VERIFIED | SOUNDLY_NUMERICALLY_VERIFIED |
#   STRUCTURAL_REGRESSION_CHECKED | SAMPLED_ONLY | EMPIRICALLY_SUPPORTED |
#   NOT_VERIFIED | NOT_APPLICABLE | CONTRADICTED

schema_version: 1

obligations:
  - obligation_id: OB-T1-1
    parent_claim_id: T1
    condition: "J_theta(z) = -J_theta(z)^T for the trained checkpoint's actual parameters."
    quantifier: "for all z (in fact state-independent here: J does not depend on z)"
    domain: "all z in R^d"
    enforcement: guaranteed_by_exact_algebra
    implementation_object: "EBM_param_fields.py::_assemble_A (A = upper_tri - upper_tri.T)"
    verification_method: "Recompute A in float64 numpy from the checkpoint's trained e_A entries; check max|A+A^T| < 1e-10."
    tolerance: "1e-10 (far above float64 rounding at this matrix scale; chosen to detect any real defect, not to accommodate one)"
    soundness_status: sound_exact_identity
    testability_status: executable
    current_evidence: "EXECUTED for copilotA1: max_abs_skew_defect = 0.0 exactly (see reports/copilotA1_structural_checks.json)."
    status: PROVED_BY_CONSTRUCTION
    canonical_test: "Stress_tests/theory_aligned/certificates/structural_checks.py::check_skew_symmetry"

  - obligation_id: OB-T2-1
    parent_claim_id: T2
    condition: "R = M_theta = M_theta^T and lambda_min(M_theta) >= 0 (theory); ACTUAL construction gives lambda_min(M_theta) > 0 strictly."
    quantifier: "for all z (state-independent for copilotA1: use_state_damping=false)"
    domain: "all z in R^d"
    enforcement: guaranteed_by_parameterization
    implementation_object: "EBM_param_fields.py::_assemble_M, _cholesky_bounded (M = L L^T, diag(L)=exp(clip(.,+/-1.5))>0)"
    verification_method: "Recompute M in float64 numpy from the checkpoint's trained L_M entries; eigvalsh; check symmetry defect < 1e-10 and lambda_min > 0."
    tolerance: "symmetry: 1e-10; positivity: > 0 (no tolerance needed given the exp(.) construction cannot produce exactly 0)"
    soundness_status: sound_exact_identity_plus_numerical_eigendecomposition
    testability_status: executable
    current_evidence: >-
      EXECUTED for copilotA1: lambda_min=0.004419, lambda_max=0.447725,
      condition_number~101.3, Cholesky diag in [0.2231,0.2569] (very close
      to the -CHOL_CLIP_EXP=-1.5 initialization value, i.e. M barely moved
      from its light-damping initialization during training).
    status: PROVED_BY_CONSTRUCTION
    canonical_test: "Stress_tests/theory_aligned/certificates/structural_checks.py::check_dissipation_pd"

  - obligation_id: OB-T3-1
    parent_claim_id: T3
