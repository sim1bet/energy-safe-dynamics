experiment_name: three_link_pendulum_porthnn_u_full_jrg
model_family: porthnn_u_full_matrix
state_dim: 6
input_dim: 1
state_representation: canonical_q_p_from_dataset_q_qdot
storage_function: existing_porthnn_u_H_tanh_200x3_scalar
j_parameterization: state_dependent_full_skew
r_parameterization: state_dependent_full_psd_cholesky
g_parameterization: state_dependent_full_matrix
