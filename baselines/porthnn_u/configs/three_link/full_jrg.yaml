horizon_probabilities: [0.2, 0.3, 0.5]
batch_size: 32
optimizer: adam
learning_rate: 3.0e-4
warmup_updates: 500
lr_schedule: cosine
final_learning_rate: 3.0e-6
updates: 20000
validation_interval: 200
gradient_clip_global_norm: 1.0
matrix_head_weight_decay: 1.0e-6
storage_weight_decay: 1.0e-6
seed: 0
precision: float64_if_supported
