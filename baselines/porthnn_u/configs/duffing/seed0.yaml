experiment_name: duffing_porthnn_u
model_family: porthnn_u_input_conditioned
state_dim: 2
input_dim: 1
state_representation: canonical_q_p
storage_function: tanh_mlp_200x3_scalar
forcing_function: tanh_mlp_200x3_scalar_of_measured_input
interconnection: canonical_skew
dissipation: learned_scalar_times_velocity
integrator: rk4
control_hold: zero_order_hold
dt: 0.02
iterations: 10000
batch_size: 200
optimizer: adam
initial_learning_rate: 1.0e-3
learning_rate_schedule: multiply_by_0.1_at_each_quarter_budget
lambda_force_l1: 1.0e-6
lambda_damping_l1: 1.0e-6
seed: 0
selection: minimum_fixed_validation_subsample_one_step_loss
normalization: identity_physical_coordinates
